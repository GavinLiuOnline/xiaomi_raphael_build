#
# Qualcomm SM8150 (Snapdragon 855) phone family.
#

declare -g LINUXFAMILY="sm8150"
declare -g ARCH="arm64"

# Vendor kernel: same source/branch as xiaomi_raphael_build_kernel/raphael-kernel_build.sh
declare -g KERNELSOURCE="https://github.com/GavinLiuOnline/xiaomi_raphael_kernel.git"
declare -g KERNELBRANCH="branch:raphael-7.0"
declare -g KERNEL_MAJOR_MINOR="7.0"
declare -g KERNEL_COMPILER="clang"

# The vendor tree carries its own changes; do not apply Armbian's patch archive.
# KERNELPATCHDIR must still be set: DISABLE_KERNEL_PATCHES empties it, which
# would also drop userpatches/kernel/<dir> (our device fixes). There is no
# patch/kernel/sm8150-current in the build tree, so only the userpatches dir is
# applied.
declare -g KERNELPATCHDIR="sm8150-current"

# U-Boot is packaged as an Android boot image (boot.img) for ABL,
# see uboot_custom_postprocess() in the board config.
declare -g BOOTSOURCE="https://github.com/GavinLiuOnline/xiaomi_raphael_uboot.git"
declare -g BOOTBRANCH="branch:mailing"
declare -g BOOTDIR="u-boot-xiaomi-raphael"

# XBL/ABL already run on the secure monitor; this U-Boot port does not use ATF.
# Without this, arm64.conf defaults ATFSOURCE to upstream TF-A and tries to
# build it, which this platform does not boot.
declare -g ATF_COMPILE="no"
declare -g ATFSOURCE="none"

# Rootfs image is converted to a bare ext4 (userdata), plus vendor/cust images
# and the flashable zip, by this extension.
enable_extension "raphael-image-output"

family_tweaks_bsp() {
	:
}

# raphael-kernel_build.sh builds this tree with "LLVM=-22" (clang-22). Armbian
# defaults to "LLVM=1" plus the distro "clang", which is not new enough for the
# vendor tree and, on this host, has no unversioned LLVM tools at all.
# Prefer the complete unversioned toolchain when present (build container),
# otherwise fall back to the newest versioned one (e.g. clang-22 on a host).
function custom_kernel_make_params__sm8150_clang_version() {
	local clang_name="clang" llvm_flag="LLVM=1"
	local version

	if ! command -v clang >/dev/null 2>&1 || ! command -v llvm-ar >/dev/null 2>&1; then
		for version in 22 21 20 19 18; do
			if command -v "clang-${version}" >/dev/null 2>&1 && command -v "llvm-ar-${version}" >/dev/null 2>&1; then
				clang_name="clang-${version}"
				llvm_flag="LLVM=-${version}"
				break
			fi
		done
	fi

	local -a params=()
	local param
	for param in "${common_make_params_quoted[@]}"; do
		[[ "${param}" == LLVM=* ]] && continue
		[[ "${param}" == CC=*clang ]] && param="${param%clang}${clang_name}"
		params+=("${param}")
	done
	params+=("${llvm_flag}")
	common_make_params_quoted=("${params[@]}")
}

