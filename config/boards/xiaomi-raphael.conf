# Xiaomi Redmi K20 Pro (xiaomi raphael / Qualcomm SM8150)
#
# Boot chain: ABL -> boot.img (U-Boot) -> EFI/BOOT/BOOTAA64.EFI on "cust" (rEFInd)
#             -> vendor:/vmlinuz-* + initrd.img-* + dtbs/qcom/sm8150-xiaomi-raphael.dtb
#             -> userdata: root filesystem.
declare -g BOARD_NAME="Xiaomi Redmi K20 Pro"
declare -g BOARD_VENDOR="xiaomi"
declare -g BOARD_MAINTAINER="nuanyang"
declare -g INTRODUCED="2026"
declare -g BOARDFAMILY="sm8150"
declare -g KERNEL_TARGET="current"
declare -g KERNEL_TEST_TARGET="current"
declare -g EXTRAWIFI="no"
declare -g BOOTCONFIG="qcom_defconfig"
declare -g UBOOT_TARGET_MAP=";;boot.img:boot.img"
declare -g IMAGE_PARTITION_TABLE="gpt"
declare -g BOOT_FDT_FILE="qcom/sm8150-xiaomi-raphael.dtb"
declare -g SERIALCON="ttyMSM0,115200"

# The vendor QCOM/ath10k firmware is shipped by the BSP below; installing
# armbian-firmware (or -full) would also install the same paths and make dpkg
# refuse to unpack the BSP package.
declare -g INSTALL_ARMBIAN_FIRMWARE="no"

function xiaomi-raphael_is_userspace_supported() {
	[[ "${RELEASE}" == "jammy" ]] && return 0
	[[ "${RELEASE}" == "noble" ]] && return 0
	[[ "${RELEASE}" == "trixie" ]] && return 0
	[[ "${RELEASE}" == "resolute" ]] && return 0
	return 1
}

# Armbian runs `make ${BOOTCONFIG}` only; re-apply the two phone fragments on top
# of qcom_defconfig, exactly like xiaomi_raphael_uboot/build-raphael-bootimg.sh.
function post_config_uboot_target__xiaomi_raphael_fragments() {
	display_alert "Applying Raphael U-Boot fragments" "${BOARD}" "info"
	run_host_command_logged make qcom_defconfig qcom-phone.config raphael-phone.config
	run_host_command_logged ./scripts/config --set-str CONFIG_DEFAULT_DEVICE_TREE "qcom/sm8150-xiaomi-raphael"
	run_host_command_logged ./scripts/config --disable TOOLS_MKEFICAPSULE
	run_host_command_logged ./scripts/config --disable EFI_RUNTIME_UPDATE_CAPSULE
	run_host_command_logged ./scripts/config --disable EFI_CAPSULE_ON_DISK
	run_host_command_logged ./scripts/config --disable EFI_CAPSULE_FIRMWARE_RAW
	return 0
}

# Package gzip(u-boot-nodtb.bin) + u-boot.dtb as the Android boot image ABL expects.
# The resulting boot.img is exported through UBOOT_TARGET_MAP and picked up by the
# image extension for the flashable zip.
function uboot_custom_postprocess() {
	display_alert "Packaging U-Boot as Android boot image" "${BOARD}" "info"
	gzip -c u-boot-nodtb.bin > u-boot-nodtb.bin.gz
	cat u-boot-nodtb.bin.gz u-boot.dtb > u-boot-nodtb.bin.gz-dtb
	# The distro "mkbootimg" package is a Python wrapper whose "gki" import is
	# broken on Ubuntu, so write the header v0 Android boot image ourselves. The
	# layout is exactly what mkbootimg produced for this device before.
	python3 - <<-'PYTHON'
		import hashlib
		import pathlib
		import struct

		kernel = pathlib.Path("u-boot-nodtb.bin.gz-dtb").read_bytes()
		pagesize = 4096
		base = 0x80000000

		def pad(data):
		    return data + b"\0" * (-len(data) % pagesize)

		header = struct.pack(
		    "<8s10I",
		    b"ANDROID!", len(kernel),
		    base + 0x00008000, 0, base + 0x01000000,
		    0, base + 0x00F00000, base + 0x00000100,
		    pagesize, 0, 0,
		)
		header += b"\0" * 16                                    # name
		header += b"\0" * 512                                   # cmdline
		header += hashlib.sha1(kernel).digest() + b"\0" * 12    # id
		header += b"\0" * (1632 - len(header))                  # extra_cmdline

		pathlib.Path("boot.img").write_bytes(pad(header) + pad(kernel))
	PYTHON
	return 0
}

# Nothing is written into the Armbian image: U-Boot goes to the "boot" partition
# as part of the flashable zip only.
function write_uboot_platform() {
	display_alert "U-Boot is shipped as boot.img in the flashable zip" "${BOARD}" "info"
	return 0
}

function write_uboot_platform_mtd() {
	return 0
}

# Firmware + device provisioning scripts, installed by the BSP package.
function post_family_tweaks_bsp__xiaomi_raphael_bsp() {
	display_alert "$BOARD" "Install firmware and provisioning for raphael" "info"

	install -d "$destination/usr" "$destination/etc"

	# QCOM/ath10k firmware, UCM-ish share files and the a630_sqe initramfs hook
	cp -a "$SRC/packages/bsp/xiaomi-raphael/rootfs/usr/." "$destination/usr/"
	cp -a "$SRC/packages/bsp/xiaomi-raphael/rootfs/etc/." "$destination/etc/"

	# Device provisioning scripts, executed in the image chroot by the hook below
	install -d "$destination/usr/share/raphael-provision"
	cp -a "$SRC/packages/bsp/xiaomi-raphael/provisioning/." "$destination/usr/share/raphael-provision/"
	find "$destination/usr/share/raphael-provision" -name '*.sh*' -exec chmod -v +x {} +

	return 0
}

# Run the device provisioning (modem, sensors, audio, GPS, power, ...) in the chroot.
function post_family_tweaks__xiaomi_raphael_provision() {
	if ! xiaomi-raphael_is_userspace_supported; then
		if [[ "${RELEASE}" != "" ]]; then
			display_alert "Missing userspace for ${BOARD}" "${RELEASE} is not supported by the raphael provisioning" "warn"
		fi
		return 0
	fi

	declare system_type="${DISTRIBUTION,,}-server"
	[[ "${BUILD_DESKTOP}" == "yes" ]] && system_type="${DISTRIBUTION,,}-gnome"

	display_alert "$BOARD" "Running device provisioning (${system_type})" "info"
	chroot_sdcard bash /usr/share/raphael-provision/run.sh \
		"${RELEASE}" "${BUILD_DESKTOP}" "${DESKTOP_ENVIRONMENT:-xfce}" "${DISTRIBUTION}"

	return 0
}

# The image is fully provisioned at build time (account, password, locale,
# autologin), so the first-boot wizard must never run: it takes over the screen
# and waits for input, leaving the phone stuck on "applying settings".
function pre_umount_final_image__xiaomi_raphael_disable_armbian_firstrun() {
	display_alert "$BOARD" "Disable first-run wizard, enable lightdm" "info"
	# Both the console setup (armbian-firstlogin) and the GUI wizard
	# (armbian-firstrun-gui.service) are gated on this file.
	run_host_command_logged rm -f "${MOUNT}/root/.not_logged_in_yet"
	run_host_command_logged rm -f "${MOUNT}/run/armbian-firstrun-gui.active"
	# systemd is not running inside the chroot, so mask by creating the links.
	local unit
	for unit in armbian-firstlogin.service armbian-firstrun-gui.service zramswap.service; do
		run_host_command_logged ln -sf /dev/null "${MOUNT}/etc/systemd/system/${unit}"
	done
	# The wizard is what normally enables the display manager after asking the
	# questions; do it here instead, with graphical.target as default.
	run_host_command_logged ln -sf /usr/lib/systemd/system/lightdm.service "${MOUNT}/etc/systemd/system/display-manager.service"
	run_host_command_logged ln -sf /usr/lib/systemd/system/graphical.target "${MOUNT}/etc/systemd/system/default.target"
	# armbian-firstrun.service itself only does first-boot housekeeping (SSH host
	# key regeneration, image UUID); keep it enabled.
	chroot_sdcard systemctl enable armbian-firstrun.service 2> /dev/null || true
	return 0
}
